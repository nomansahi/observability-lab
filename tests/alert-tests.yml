rule_files:
  - ../prometheus/alerts.yml

evaluation_interval: 1m

tests:
  - name: healthy_probe
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '1 1 1'
      - series: 'probe_success{job="site_probe",instance="probe.example:9115"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []

  - name: http_probe_failure
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '1 1 1'
      - series: 'probe_success{job="site_probe",instance="probe.example:9115"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "HTTP probe failed for probe.example:9115"
              description: "The probe was scraped, but its HTTP check failed. Check the URL, DNS, TLS, connectivity, and probe configuration."
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []

  - name: scrape_failure
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "Probe scrape failed for probe.example:9115"
              description: "Prometheus could not scrape the probe endpoint. Check the Prometheus target error, scrape address, exporter, and connectivity."
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []

  - name: probe_recovers
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '1 1 1'
      - series: 'probe_success{job="site_probe",instance="probe.example:9115"}'
        values: '0 0 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: SiteProbeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "HTTP probe failed for probe.example:9115"
              description: "The probe was scraped, but its HTTP check failed. Check the URL, DNS, TLS, connectivity, and probe configuration."
      - eval_time: 1m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: SiteProbeResultMissing
        exp_alerts: []

      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []

  - name: scrape_recovers
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '0 0 1'
      - series: 'probe_success{job="site_probe",instance="probe.example:9115"}'
        values: '_ _ 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: SiteProbeScrapeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "Probe scrape failed for probe.example:9115"
              description: "Prometheus could not scrape the probe endpoint. Check the Prometheus target error, scrape address, exporter, and connectivity."
      - eval_time: 1m
        alertname: SiteProbeResultMissing
        exp_alerts: []

      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []

  - name: probe_result_disappears
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '1 1 1'
      - series: 'probe_success{job="site_probe",instance="probe.example:9115"}'
        values: '1 stale _'
    alert_rule_test:
      - eval_time: 0m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 0m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 0m
        alertname: SiteProbeResultMissing
        exp_alerts: []

      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "Probe result missing for probe.example:9115"
              description: "The scrape succeeded, but probe_success is missing. Check the probe endpoint, module settings, and metric filtering."

  - name: probe_flaps
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="probe.example:9115"}'
        values: '1 1 1 1'
      - series: 'probe_success{job="site_probe",instance="probe.example:9115"}'
        values: '1 0 1 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: SiteProbeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "HTTP probe failed for probe.example:9115"
              description: "The probe was scraped, but its HTTP check failed. Check the URL, DNS, TLS, connectivity, and probe configuration."
      - eval_time: 1m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: SiteProbeResultMissing
        exp_alerts: []

      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []

      - eval_time: 3m
        alertname: SiteProbeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: probe.example:9115
            exp_annotations:
              summary: "HTTP probe failed for probe.example:9115"
              description: "The probe was scraped, but its HTTP check failed. Check the URL, DNS, TLS, connectivity, and probe configuration."
      - eval_time: 3m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: SiteProbeResultMissing
        exp_alerts: []

  - name: multiple_instances_fail
    interval: 1m
    input_series:
      - series: 'up{job="site_probe",instance="site-a"}'
        values: '1 1 1'
      - series: 'probe_success{job="site_probe",instance="site-a"}'
        values: '0 0 0'
      - series: 'up{job="site_probe",instance="site-b"}'
        values: '1 1 1'
      - series: 'probe_success{job="site_probe",instance="site-b"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: SiteProbeFailed
        exp_alerts:
          - exp_labels:
              job: site_probe
              instance: site-a
            exp_annotations:
              summary: "HTTP probe failed for site-a"
              description: "The probe was scraped, but its HTTP check failed. Check the URL, DNS, TLS, connectivity, and probe configuration."
          - exp_labels:
              job: site_probe
              instance: site-b
            exp_annotations:
              summary: "HTTP probe failed for site-b"
              description: "The probe was scraped, but its HTTP check failed. Check the URL, DNS, TLS, connectivity, and probe configuration."
      - eval_time: 2m
        alertname: SiteProbeScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SiteProbeResultMissing
        exp_alerts: []